<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh Sinh Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-primary { background-color: #007bff; }
    .btn-success { background-color: #28a745; margin-top: 10px; }

    .status-badge {
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    .divider {
      margin: 20px 0;
      position: relative;
      text-align: center;
    }
    .divider::before {
      content: "";
      position: absolute;
      top: 50%; left: 0; right: 0;
      height: 1px;
      background: #ddd;
      z-index: 1;
    }
    .divider span {
      background: white;
      padding: 0 12px;
      position: relative;
      z-index: 2;
      color: #6c757d;
      font-size: 13px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: center;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .result-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên</h2>

    <!-- THANH TRẠNG THÁI NFC -->
    <div id="statusBadge" class="status-badge">
      👆 Chạm vào màn hình 1 lần để bật cảm biến NFC
    </div>

    <!-- PHƯƠNG THỨC 1: QUÉT NFC -->
    <button id="scanBtn" class="btn btn-primary">📲 Bật Cảm Biến NFC</button>

    <div class="divider"><span>HOẶC NHẬP THỦ CÔNG</span></div>

    <!-- PHƯƠNG THỨC 2: NHẬP MSSV THỦ CÔNG (ĐÃ ĐƯỢC GIỮ LẠI) -->
    <form id="manualForm">
      <input type="text" id="mssvInput" placeholder="Nhập MSSV (VD: 2280619040)" required autocomplete="off">
      <button type="submit" class="btn btn-success">✅ Check-in Bằng MSSV</button>
    </form>

    <!-- KHUNG KẾT QUẢ KHI ĐIỂM DANH -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Hình thức:</strong> <span id="resMethod"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
    </div>
  </div>

  <script>
    // ⚙️ URL API Backend trên Railway/Render của bạn
    const BACKEND_URL = 'https://checkinnfc-production.up.railway.app/api/checkin';

    const statusBadge = document.getElementById('statusBadge');
    const scanBtn = document.getElementById('scanBtn');
    const manualForm = document.getElementById('manualForm');
    const mssvInput = document.getElementById('mssvInput');

    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resMethod = document.getElementById('resMethod');
    const resTime = document.getElementById('resTime');

    let isNfcStarted = false;

    // 1. HÀM KÍCH HOẠT CẢM BIẾN NFC BẬT LIÊN TỤC
    async function startNFCContinuous() {
      if (isNfcStarted) return;

      if (!('NDEFReader' in window)) {
        statusBadge.style.background = '#f8d7da';
        statusBadge.style.color = '#721c24';
        statusBadge.textContent = '❌ Trình duyệt không hỗ trợ Web NFC (Cần Chrome Android).';
        return;
      }

      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        isNfcStarted = true;

        statusBadge.style.background = '#d4edda';
        statusBadge.style.color = '#155724';
        statusBadge.textContent = '🟢 NFC ĐANG BẬT LIÊN TỤC - Chạm thẻ vào mặt lưng!';

        // Lắng nghe quét thẻ ngầm liên tục
        ndef.addEventListener("reading", async ({ serialNumber }) => {
          if (serialNumber) {
            // parameter isManual = false -> Quét NFC ngầm sẽ KHÔNG xóa ô gõ MSSV
            await processCheckin({ uid: serialNumber }, false);
          }
        });

      } catch (error) {
        statusBadge.textContent = `⚠️ Nhấn vào màn hình để bật NFC! (${error.message || error})`;
      }
    }

    // Tự động kích hoạt NFC khi người dùng chạm bất kỳ đâu trên màn hình lần đầu
    document.addEventListener('click', startNFCContinuous, { once: true });
    document.addEventListener('touchstart', startNFCContinuous, { once: true });
    scanBtn.addEventListener('click', startNFCContinuous);

    // 2. CHECK-IN BẰNG CÁCH NHẬP MSSV THỦ CÔNG
    manualForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mssv = mssvInput.value.trim();
      if (!mssv) return;

      // parameter isManual = true
      await processCheckin({ mssv: mssv }, true);
    });

    // 3. HÀM XỬ LÝ KẾT NỐI API CHUNG
    async function processCheckin(payload, isManual = false) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resMethod.textContent = result.data.method || (isManual ? 'Thủ công' : 'Thẻ NFC');
          resTime.textContent = result.data.timestamp;
          resultBox.style.display = 'block';

          // Chỉ xóa nội dung ô gõ nếu lượt điểm danh thành công đến từ THỦ CÔNG
          if (isManual) {
            mssvInput.value = '';
          }
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thất Bại';
          resName.textContent = 'Không tìm thấy';
          resMssv.textContent = payload.mssv || 'N/A';
          resMethod.textContent = isManual ? 'Thủ công' : 'Thẻ NFC';
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resultBox.style.display = 'block';
        }
      } catch (err) {
        alert(`❌ Lỗi kết nối Backend API: ${err.message}`);
      }
    }
  </script>
</body>
</html>
