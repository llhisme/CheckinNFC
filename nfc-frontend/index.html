<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh Sinh Viên - WebHID API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 20px auto 0 auto;
    }
    .btn-connect {
      background-color: #17a2b8;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
    }
    .status-badge {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
      background: #e2e3e5;
      color: #383d41;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #007bff;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: center;
      outline: none;
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .result-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên</h2>

    <!-- THÔNG BÁO TRẠNG THÁI WEBHID -->
    <div id="statusBadge" class="status-badge">⚪ Chưa kết nối Máy quét USB qua WebHID</div>
    <button id="connectHidBtn" class="btn-connect">🔌 Kết nối Máy Quét QR USB</button>

    <!-- FORM NHẬP THỦ CÔNG -->
    <form id="checkinForm">
      <input 
        type="text" 
        id="mssvInput" 
        placeholder="Nhập MSSV thủ công tại đây..." 
        autocomplete="off"
        autofocus
      >
    </form>

    <!-- KẾT QUẢ ĐIỂM DANH -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Hình thức:</strong> <span id="resMethod"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://nfc-backend-production-xxxx.up.railway.app/api/checkin';

    const connectHidBtn = document.getElementById('connectHidBtn');
    const statusBadge = document.getElementById('statusBadge');
    const checkinForm = document.getElementById('checkinForm');
    const mssvInput = document.getElementById('mssvInput');

    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resMethod = document.getElementById('resMethod');
    const resTime = document.getElementById('resTime');

    // Giữ con trỏ nhấp nháy liên tục ở ô gõ MSSV thủ công
    function keepFocus() { mssvInput.focus(); }
    window.addEventListener('load', keepFocus);
    document.addEventListener('click', keepFocus);

    // =======================================================
    // BẢNG ÁNH XẠ MÃ HEX USB HID USAGE (PAGE 0x07) SANG CHỮ/SỐ
    // =======================================================
    const HID_KEY_MAP = {
      0x1E: '1', 0x1F: '2', 0x20: '3', 0x21: '4', 0x22: '5',
      0x23: '6', 0x24: '7', 0x25: '8', 0x26: '9', 0x27: '0',
      0x04: 'A', 0x05: 'B', 0x06: 'C', 0x07: 'D', 0x08: 'E', 0x09: 'F',
      0x0A: 'G', 0x0B: 'H', 0x0C: 'I', 0x0D: 'J', 0x0E: 'K', 0x0F: 'L',
      0x10: 'M', 0x11: 'N', 0x12: 'O', 0x13: 'P', 0x14: 'Q', 0x15: 'R',
      0x16: 'S', 0x17: 'T', 0x18: 'U', 0x19: 'V', 0x1A: 'W', 0x1B: 'X',
      0x1C: 'Y', 0x1D: 'Z'
    };

    let hidDevice = null;
    let hidBuffer = '';
    let lastProcessedKey = 0;

    // =======================================================
    // KẾT NỐI MÁY QUÉT MÃ QR QUA WEBHID API
    // =======================================================
    connectHidBtn.addEventListener('click', async () => {
      if (!('hid' in navigator)) {
        alert('Trình duyệt không hỗ trợ WebHID! Vui lòng dùng Chrome hoặc Edge trên máy tính.');
        return;
      }

      try {
        // Yêu cầu cấp quyền chọn máy quét USB
        const devices = await navigator.hid.requestDevice({ filters: [] });
        if (devices.length === 0) return;

        hidDevice = devices[0];
        await hidDevice.open();

        statusBadge.style.background = '#d4edda';
        statusBadge.style.color = '#155724';
        statusBadge.textContent = `🟢 Đã kết nối ngầm: ${hidDevice.productName || 'Máy quét QR USB'}`;
        connectHidBtn.style.display = 'none'; // Ẩn nút sau khi kết nối thành công

        // 💥 LẮNG NGHE DỮ LIỆU TỪ CỔNG USB NGOẠI VI (KHÔNG QUA BÀN PHÍM OS)
        hidDevice.addEventListener('inputreport', (event) => {
          const { data } = event; // DataView 8 bytes của USB HID Report
          if (data.byteLength < 3) return;

          const keyCode = data.getUint8(2); // Byte số 2 chứa mã phím HID

          // Bỏ qua khi nhả phím (Key release = 0) hoặc ký tự lặp
          if (keyCode === 0) {
            lastProcessedKey = 0;
            return;
          }
          if (keyCode === lastProcessedKey) return;
          lastProcessedKey = keyCode;

          // 0x28 = Phím Enter trong chuẩn USB HID
          if (keyCode === 0x28) {
            if (hidBuffer.length > 0) {
              const scannedMssv = hidBuffer;
              hidBuffer = '';
              // Điểm danh ngầm, tham số clearInput = false (Không đụng đến ô đang gõ dở)
              processCheckin(scannedMssv, 'Máy quét QR (WebHID Direct)', false);
            }
          } else if (HID_KEY_MAP[keyCode]) {
            hidBuffer += HID_KEY_MAP[keyCode];
          }
        });

      } catch (err) {
        alert(`❌ Lỗi kết nối WebHID: ${err.message}`);
      }
    });

    // Tự động kết nối lại nếu thiết bị đã từng được cấp quyền trước đó
    window.addEventListener('DOMContentLoaded', async () => {
      if ('hid' in navigator) {
        const existingDevices = await navigator.hid.getDevices();
        if (existingDevices.length > 0) {
          hidDevice = existingDevices[0];
          await hidDevice.open();
          statusBadge.style.background = '#d4edda';
          statusBadge.style.color = '#155724';
          statusBadge.textContent = `🟢 Đã tự động kết nối: ${hidDevice.productName || 'Máy quét QR USB'}`;
          connectHidBtn.style.display = 'none';
        }
      }
    });

    // =======================================================
    // LUỒNG 2: NHẬP THỦ CÔNG BẰNG BÀN PHÍM BÌNH THƯỜNG
    // =======================================================
    checkinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mssv = mssvInput.value.trim();
      if (!mssv) return;

      // Điểm danh thủ công -> clearInput = true để xóa sạch ô gõ sau khi xong
      await processCheckin(mssv, 'Nhập thủ công', true);
    });

    // =======================================================
    // HÀM GỬI API CHECK-IN CHUNG
    // =======================================================
    async function processCheckin(mssv, method, clearInput = true) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mssv: mssv })
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resMethod.textContent = method;
          resTime.textContent = result.data.timestamp;
          resultBox.style.display = 'block';
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thất Bại';
          resName.textContent = 'Không tìm thấy sinh viên';
          resMssv.textContent = mssv;
          resMethod.textContent = method;
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resultBox.style.display = 'block';
        }
      } catch (err) {
        resultBox.className = 'result-box error';
        resTitle.textContent = '❌ Lỗi Hệ Thống';
        resName.textContent = err.message;
        resMssv.textContent = mssv;
        resMethod.textContent = method;
        resTime.textContent = new Date().toLocaleTimeString('vi-VN');
        resultBox.style.display = 'block';
      } finally {
        if (clearInput) {
          mssvInput.value = '';
        }
        keepFocus();
      }
    }
  </script>
</body>
</html>
