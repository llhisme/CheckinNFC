<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh Sinh Viên - Web Serial API</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f8f9fa; }
    .card { background: white; padding: 30px 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 420px; margin: 20px auto 0 auto; }
    .btn-connect { background-color: #28a745; color: white; border: none; padding: 12px 18px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 15px; }
    .status-badge { padding: 10px; border-radius: 6px; font-size: 13px; font-weight: bold; margin-bottom: 15px; background: #e2e3e5; color: #383d41; }
    input[type="text"] { width: 100%; padding: 16px; font-size: 18px; border: 2px solid #007bff; border-radius: 8px; box-sizing: border-box; text-align: center; outline: none; }
    .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; text-align: left; display: none; }
    .result-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .result-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên</h2>

    <div id="statusBadge" class="status-badge">⚪ Chưa kết nối máy quét (Virtual COM)</div>
    <button id="connectSerialBtn" class="btn-connect">🔌 Kết nối Máy Quét QR (Cổng COM)</button>

    <form id="checkinForm">
      <input type="text" id="mssvInput" placeholder="Nhập MSSV thủ công tại đây..." autocomplete="off" autofocus>
    </form>

    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Hình thức:</strong> <span id="resMethod"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://nfc-backend-production-xxxx.up.railway.app/api/checkin';

    const connectSerialBtn = document.getElementById('connectSerialBtn');
    const statusBadge = document.getElementById('statusBadge');
    const checkinForm = document.getElementById('checkinForm');
    const mssvInput = document.getElementById('mssvInput');

    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resTime = document.getElementById('resTime');
    const resMethod = document.getElementById('resMethod');

    function keepFocus() { mssvInput.focus(); }
    window.addEventListener('load', keepFocus);
    document.addEventListener('click', keepFocus);

    let port;
    let reader;

    // KẾT NỐI MÁY QUÉT CHẠY CHẾ ĐỘ VIRTUAL COM
    connectSerialBtn.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        alert('Trình duyệt không hỗ trợ Web Serial! Vui lòng dùng Chrome hoặc Edge trên máy tính.');
        return;
      }

      try {
        // Yêu cầu cấp quyền chọn Cổng COM của máy quét
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 }); // Tốc độ baud mặc định thường là 9600 hoặc 115200

        statusBadge.style.background = '#d4edda';
        statusBadge.style.color = '#155724';
        statusBadge.textContent = '🟢 Đã kết nối Cổng Serial ngầm! Máy quét sẽ không gõ vào bàn phím nữa.';
        connectSerialBtn.style.display = 'none';

        // Đọc luồng dữ liệu chữ ngầm từ cổng Serial
        const textDecoder = new TextDecoderStream();
        const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
        reader = textDecoder.readable.getReader();

        let serialBuffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            reader.releaseLock();
            break;
          }

          serialBuffer += value;

          // Khi nhận được ký tự xuống dòng (\r hoặc \n) tức là đã quét xong 1 mã
          if (serialBuffer.includes('\r') || serialBuffer.includes('\n')) {
            const scannedMssv = serialBuffer.replace(/[\r\n]/g, '').trim();
            serialBuffer = '';

            if (scannedMssv.length > 0) {
              // Gửi điểm danh ngầm, KHÔNG ảnh hưởng ô input (clearInput = false)
              processCheckin(scannedMssv, 'Máy quét QR (Serial Mode)', false);
            }
          }
        }

      } catch (err) {
        alert(`❌ Lỗi kết nối Serial Port: ${err.message}`);
      }
    });

    // LUỒNG NHẬP THỦ CÔNG BẰNG BÀN PHÍM
    checkinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mssv = mssvInput.value.trim();
      if (!mssv) return;

      await processCheckin(mssv, 'Nhập thủ công', true);
    });

    // HÀM GỬI API CHECK-IN CHUNG
    async function processCheckin(mssv, method, clearInput = true) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mssv: mssv })
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resMethod.textContent = method;
          resTime.textContent = result.data.timestamp;
          resultBox.style.display = 'block';
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thất Bại';
          resName.textContent = 'Không tìm thấy sinh viên';
          resMssv.textContent = mssv;
          resMethod.textContent = method;
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resultBox.style.display = 'block';
        }
      } catch (err) {
        resultBox.className = 'result-box error';
        resTitle.textContent = '❌ Lỗi Hệ Thống';
        resName.textContent = err.message;
        resMssv.textContent = mssv;
        resMethod.textContent = method;
        resTime.textContent = new Date().toLocaleTimeString('vi-VN');
        resultBox.style.display = 'block';
      } finally {
        if (clearInput) {
          mssvInput.value = '';
        }
        keepFocus();
      }
    }
  </script>
</body>
</html>
