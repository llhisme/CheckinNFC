<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh Sinh Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 40px auto 0 auto;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .hint-text {
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #007bff;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: center;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.25);
    }
    input[type="text"]:focus {
      border-color: #0056b3;
      box-shadow: 0 0 10px rgba(0, 86, 179, 0.4);
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .result-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên</h2>
    <p class="hint-text">Quét mã QR hoặc Nhập MSSV rồi nhấn <strong>ENTER</strong></p>

    <!-- FORM CHỈ CHỨA Ô INPUT (KHÔNG NÚT BẤM) -->
    <form id="checkinForm">
      <input 
        type="text" 
        id="mssvInput" 
        placeholder="Nhập MSSV / Quét QR..." 
        autocomplete="off"
        autofocus
      >
    </form>

    <!-- KHUNG KẾT QUẢ KHI ĐIỂM DANH -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Hình thức:</strong> <span id="resMethod"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
    </div>
  </div>

  <script>
    // ⚙️ URL API Backend trên Railway của bạn
    const BACKEND_URL = 'https://checkinnfc-production.up.railway.app/api/checkin';

    const checkinForm = document.getElementById('checkinForm');
    const mssvInput = document.getElementById('mssvInput');

    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resMethod = document.getElementById('resMethod');
    const resTime = document.getElementById('resTime');

    // 1. GIỮ CON TRỎ MÁY TÍNH LUÔN LUÔN NHẤP NHÁY TRONG Ô INPUT
    function keepFocus() {
      mssvInput.focus();
    }
    window.addEventListener('load', keepFocus);
    document.addEventListener('click', keepFocus);
    mssvInput.addEventListener('blur', () => setTimeout(keepFocus, 10));

    // 2. BỘ CHẶN TỐC ĐỘ GÕ ĐỂ TÁCH BIỆT MÁY QUÉT QR VÀ NHẬP THỦ CÔNG
    let qrBuffer = '';
    let lastKeyTime = 0;
    let lastKeyChar = '';

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key.length !== 1) return;

      const currentTime = Date.now();
      const timeDiff = currentTime - lastKeyTime;
      lastKeyTime = currentTime;

      // Nếu tốc độ phát tín hiệu phím < 35ms -> Đây là máy quét QR ngoại vi
      if (timeDiff < 35) {
        // Thu hồi ký tự đầu tiên nếu trót lỡ nhảy vào ô mssvInput
        if (qrBuffer.length === 0 && lastKeyChar) {
          qrBuffer += lastKeyChar;
          if (mssvInput.value.endsWith(lastKeyChar)) {
            mssvInput.value = mssvInput.value.slice(0, -1);
          }
        }

        // Chặn máy quét rải chữ vào ô input đang gõ dở
        e.preventDefault();

        if (e.key === 'Enter') {
          if (qrBuffer.length >= 3) {
            const scannedMssv = qrBuffer;
            qrBuffer = '';
            lastKeyChar = '';
            // Gửi API điểm danh QR độc lập (clearInput = false để không xóa ô gõ dở)
            processCheckin(scannedMssv, 'Máy quét QR', false);
          }
        } else {
          qrBuffer += e.key;
        }
      } else {
        // Người dùng gõ tay bình thường
        if (timeDiff > 150) {
          qrBuffer = '';
        }
        lastKeyChar = e.key;
      }
    }, true); // Dùng capture phase để chặn sự kiện bàn phím kịp thời

    // 3. XỬ LÝ NHẬP THỦ CÔNG KHI BẤM ENTER
    checkinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mssv = mssvInput.value.trim();
      if (!mssv) return;

      // Gửi API thủ công -> clearInput = true để xóa sạch ô sau khi gửi xong
      await processCheckin(mssv, 'Nhập thủ công', true);
    });

    // 4. HÀM GỬI API CHECK-IN CHUNG
    async function processCheckin(mssv, method, clearInput = true) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mssv: mssv })
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resMethod.textContent = method;
          resTime.textContent = result.data.timestamp;
          resultBox.style.display = 'block';
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thất Bại';
          resName.textContent = 'Không tìm thấy sinh viên';
          resMssv.textContent = mssv;
          resMethod.textContent = method;
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resultBox.style.display = 'block';
        }
      } catch (err) {
        resultBox.className = 'result-box error';
        resTitle.textContent = '❌ Lỗi Hệ Thống';
        resName.textContent = err.message;
        resMssv.textContent = mssv;
        resMethod.textContent = method;
        resTime.textContent = new Date().toLocaleTimeString('vi-VN');
        resultBox.style.display = 'block';
      } finally {
        if (clearInput) {
          mssvInput.value = '';
        }
        keepFocus(); // Đảm bảo con trỏ chuột luôn quay lại nhấp nháy trong ô input
      }
    }
  </script>
</body>
</html>
