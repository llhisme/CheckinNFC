<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh NFC Sinh Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active { background-color: #0056b3; }
    
    /* Khung hiển thị kết quả sinh viên */
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result-box.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    #log {
      margin-top: 20px;
      text-align: left;
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên NFC</h2>
    <p>Chạm thẻ sinh viên vào mặt lưng điện thoại sau khi bật quét.</p>
    <button id="scanBtn">Bắt đầu quét NFC</button>
    
    <!-- Khung thông tin sinh viên sau khi check-in thành công/thất bại -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
      <p style="margin: 5px 0;"><strong>UID Thẻ:</strong> <small id="resUid"></small></p>
    </div>

    <div id="log">Trạng thái: Sẵn sàng...</div>
  </div>

  <script>
    // ⚙️ ĐƯỜNG DẪN BACKEND API: Thay đổi URL này tương ứng với domain backend của bạn
    // Ví dụ khi dev local: 'http://localhost:3000/api/checkin' hoặc khi deploy: 'https://your-backend.onrender.com/api/checkin'
    const BACKEND_URL = 'https://checkinnfc-production.up.railway.app/api/checkin';

    const scanBtn = document.getElementById('scanBtn');
    const logDiv = document.getElementById('log');
    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resTime = document.getElementById('resTime');
    const resUid = document.getElementById('resUid');

    function log(message) {
      logDiv.textContent += '\n' + message;
    }

    scanBtn.addEventListener('click', async () => {
      // 1. Kiểm tra Web NFC support
      if (!('NDEFReader' in window)) {
        logDiv.textContent = '❌ Trình duyệt hoặc thiết bị này không hỗ trợ Web NFC (Cần Chrome trên Android).';
        return;
      }

      try {
        logDiv.textContent = '⏳ Đang khởi tạo cảm biến NFC...';
        resultBox.style.display = 'none'; // Ẩn kết quả cũ
        
        const ndef = new NDEFReader();
        await ndef.scan();
        
        logDiv.textContent = '✅ Cảm biến đang bật! Vui lòng chạm thẻ sinh viên vào mặt lưng điện thoại...';

        ndef.addEventListener("readingerror", () => {
          log("⚠️ Không thể đọc dữ liệu thẻ. Hãy thử lại!");
        });

        // 2. Khi quét thành công UID thẻ
        ndef.addEventListener("reading", async ({ message, serialNumber }) => {
          // 1. In tiêu đề Debug
          log("\n==========================================");
          log(`🔍 [DEBUG NFC SCAN] - ${new Date().toLocaleTimeString('vi-VN')}`);
          log(`------------------------------------------`);
          
          // 2. Đọc mã UID phần cứng của thẻ (Hardware Serial Number)
          log(`💳 Mã UID thẻ (Serial Number): ${serialNumber || 'Không thể lấy UID'}`);
          log(`📦 Số lượng bản ghi NDEF (Records): ${message.records.length}`);

          // 3. Nếu thẻ không có dữ liệu NDEF (Thẻ trắng hoặc thẻ bị khóa)
          if (message.records.length === 0) {
            log(`ℹ️ Ghi chú: Thẻ trống hoặc sử dụng định dạng riêng (chỉ đọc được UID phần cứng để điểm danh).`);
          } else {
            // 4. Duyệt qua và đọc chi tiết từng NDEF Record có trong thẻ
            const textDecoder = new TextDecoder();

            message.records.forEach((record, index) => {
              log(`\n--- Bản ghi NDEF #${index + 1} ---`);
              log(`• Loại bản ghi (Record Type): ${record.recordType}`);
              if (record.mediaType) log(`• Kiểu MIME (Media Type): ${record.mediaType}`);
              if (record.id) log(`• Record ID: ${record.id}`);
              if (record.encoding) log(`• Chuẩn mã hóa: ${record.encoding}`);
              if (record.lang) log(`• Ngôn ngữ: ${record.lang}`);

              // Giải mã Payload / Data
              if (record.data) {
                log(`• Kích thước Data: ${record.data.byteLength} bytes`);

                // 解码 1: Chuỗi văn bản (UTF-8 Text)
                try {
                  const decodedText = textDecoder.decode(record.data);
                  log(`• Dữ liệu chữ (Decoded Text): "${decodedText}"`);
                } catch (e) {
                  log(`• Dữ liệu chữ: [Không phải chuẩn UTF-8]`);
                }

                // 解码 2: Dữ liệu Byte thô mã HEX (Raw Hex Bytes)
                const byteArray = new Uint8Array(record.data.buffer);
                const hexArray = Array.from(byteArray).map(b => b.toString(16).padStart(2, '0').toUpperCase());
                log(`• Dữ liệu mảng Byte (HEX): ${hexArray.join(' ')}`);
              }
            });
          }

          log(`==========================================\n`);

          // 5. Sau khi in Debug xong, vẫn tiếp tục gửi UID lên Backend để điểm danh như bình thường
          if (serialNumber) {
            await checkinStudent(serialNumber);
          }
        });
        
      } catch (error) {
        logDiv.textContent = `❌ Lỗi NFC: ${error.message || error}`;
      }
    });

    // Hàm gọi API Backend điểm danh
    async function checkinStudent(uid) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: uid })
        });

        const result = await response.json();

        if (result.success) {
          // Trường hợp UID có trong CSDL -> Hiện thông tin điểm danh thành công
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resTime.textContent = result.data.timestamp;
          resUid.textContent = result.data.uid;
          resultBox.style.display = 'block';

          logDiv.textContent = `✅ Đã nhận diện: ${result.data.fullName} (${result.data.mssv})`;
        } else {
          // Trường hợp thẻ chưa đăng ký trong CSDL
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thẻ Chưa Đăng Ký';
          resName.textContent = 'Không tìm thấy';
          resMssv.textContent = 'N/A';
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resUid.textContent = uid;
          resultBox.style.display = 'block';

          logDiv.textContent = `⚠️ Thông báo: ${result.message}`;
        }
      } catch (err) {
        logDiv.textContent = `❌ Lỗi kết nối Backend API: ${err.message}\n(Vui lòng kiểm tra biến BACKEND_URL và server Node.js)`;
      }
    }
  </script>
</body>
</html>
