<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Điểm Danh Sinh Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 420px;
      margin: 40px auto 0 auto;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .hint-text {
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #007bff;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: center;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 123, 255, 0.25);
    }
    input[type="text"]:focus {
      border-color: #0056b3;
      box-shadow: 0 0 10px rgba(0, 86, 179, 0.4);
    }
    .result-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .result-box.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Điểm Danh Sinh Viên</h2>
    <p class="hint-text">Quét mã QR hoặc Nhập MSSV rồi nhấn <strong>ENTER</strong></p>

    <!-- FORM CHỈ CHỨA Ô INPUT (KHÔNG NÚT) -->
    <form id="checkinForm">
      <input 
        type="text" 
        id="mssvInput" 
        placeholder="Nhập MSSV / Quét QR..." 
        autocomplete="off"
        autofocus
      >
    </form>

    <!-- KHUNG KẾT QUẢ KHI ĐIỂM DANH -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
    </div>
  </div>

  <script>
    // ⚙️ URL API Backend trên Railway của bạn
    const BACKEND_URL = 'https://checkinnfc-production.up.railway.app/api/checkin';

    const checkinForm = document.getElementById('checkinForm');
    const mssvInput = document.getElementById('mssvInput');

    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resTime = document.getElementById('resTime');

    // 1. TỰ ĐỘNG KHÓA CON TRỎ MÁY TÍNH LUÔN LUÔN Ở Ô INPUT
    function keepFocus() {
      mssvInput.focus();
    }
    
    // Tự động giữ con trỏ ngay khi load trang, khi click bất kỳ đâu, hoặc khi ô input bị ngắt focus
    window.addEventListener('load', keepFocus);
    document.addEventListener('click', keepFocus);
    mssvInput.addEventListener('blur', () => setTimeout(keepFocus, 10));

    // 2. XỬ LÝ SỰ KIỆN KHI NHẤN ENTER (HOẶC MÁY QUÉT QR BẮN PHÍM ENTER)
    checkinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const mssv = mssvInput.value.trim();
      if (!mssv) return;

      // Xóa ô nhập ngay lập tức để sẵn sàng nhận mã tiếp theo
      mssvInput.value = '';

      await processCheckin(mssv);
    });

    // 3. HÀM GỬI API ĐIỂM DANH
    async function processCheckin(mssv) {
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mssv: mssv })
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resTime.textContent = result.data.timestamp;
          resultBox.style.display = 'block';
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thất Bại';
          resName.textContent = 'Không tìm thấy sinh viên';
          resMssv.textContent = mssv;
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resultBox.style.display = 'block';
        }
      } catch (err) {
        resultBox.className = 'result-box error';
        resTitle.textContent = '❌ Lỗi Hệ Thống';
        resName.textContent = err.message;
        resMssv.textContent = mssv;
        resTime.textContent = new Date().toLocaleTimeString('vi-VN');
        resultBox.style.display = 'block';
      } finally {
        keepFocus(); // Đảm bảo con trỏ nhấp nháy lại ngay lập tức
      }
    }
  </script>
</body>
</html>
