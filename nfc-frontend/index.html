<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh & Debug NFC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 450px;
      margin: 0 auto;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active { background-color: #0056b3; }
    
    /* Khung hiển thị kết quả điểm danh */
    .result-box {
      margin-top: 15px;
      padding: 16px;
      border-radius: 8px;
      text-align: left;
      display: none;
    }
    .result-box.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .result-box.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    /* Khung in log debug chi tiết */
    #log {
      margin-top: 15px;
      text-align: left;
      background: #1e1e1e;
      color: #00ff66;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>NFC Reader & Debugger</h2>
    <p>Chạm thẻ sinh viên vào mặt lưng điện thoại để đọc dữ liệu.</p>
    <button id="scanBtn">Bắt đầu quét NFC</button>
    
    <!-- Khung kết quả điểm danh (không đè lên log) -->
    <div id="resultBox" class="result-box">
      <h3 id="resTitle" style="margin-top: 0; margin-bottom: 10px;"></h3>
      <p style="margin: 5px 0;"><strong>Họ và tên:</strong> <span id="resName"></span></p>
      <p style="margin: 5px 0;"><strong>MSSV:</strong> <span id="resMssv"></span></p>
      <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span id="resTime"></span></p>
      <p style="margin: 5px 0;"><strong>UID Thẻ:</strong> <small id="resUid"></small></p>
    </div>

    <!-- Khung log debug dữ liệu thẻ -->
    <div id="log">Trạng thái: Sẵn sàng quét...</div>
  </div>

  <script>
    // ⚙️ THAY BẰNG URL BACKEND RAILWAY CỦA BẠN
    const BACKEND_URL = 'https://nfc-backend-production-xxxx.up.railway.app/api/checkin';

    const scanBtn = document.getElementById('scanBtn');
    const logDiv = document.getElementById('log');
    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resName = document.getElementById('resName');
    const resMssv = document.getElementById('resMssv');
    const resTime = document.getElementById('resTime');
    const resUid = document.getElementById('resUid');

    // Hàm in log nối tiếp (không bao giờ xóa log cũ trừ khi bật quét mới)
    function log(message) {
      logDiv.textContent += '\n' + message;
      logDiv.scrollTop = logDiv.scrollHeight; // Tự động cuộn xuống cuối
    }

    scanBtn.addEventListener('click', async () => {
      if (!('NDEFReader' in window)) {
        logDiv.textContent = '❌ Trình duyệt hoặc thiết bị này không hỗ trợ Web NFC (Cần Chrome trên Android).';
        return;
      }

      try {
        logDiv.textContent = '⏳ Đang khởi tạo cảm biến NFC...';
        resultBox.style.display = 'none';
        
        const ndef = new NDEFReader();
        await ndef.scan();
        
        logDiv.textContent = '✅ Cảm biến NFC đang bật! Vui lòng chạm thẻ vào mặt lưng...';

        ndef.addEventListener("readingerror", () => {
          log("⚠️ Không thể đọc dữ liệu thẻ. Hãy thử lại!");
        });

        // Đọc dữ liệu chi tiết từ thẻ NFC
        ndef.addEventListener("reading", async ({ message, serialNumber }) => {
          // In Debug dữ liệu thẻ lên khung log đen
          log(`\n==========================================`);
          log(`🔍 [NFC SCAN DETECTED] - ${new Date().toLocaleTimeString('vi-VN')}`);
          log(`💳 Mã UID (Serial Number): ${serialNumber || 'Không thể lấy UID'}`);
          log(`📦 Số lượng bản ghi NDEF: ${message.records.length}`);

          if (message.records.length === 0) {
            log(`ℹ️ Ghi chú: Thẻ trống hoặc không dùng định dạng NDEF.`);
          } else {
            const textDecoder = new TextDecoder();
            message.records.forEach((record, index) => {
              log(`\n--- Record NDEF #${index + 1} ---`);
              log(`• Type: ${record.recordType}`);
              if (record.mediaType) log(`• MIME Type: ${record.mediaType}`);
              
              if (record.data) {
                log(`• Data Size: ${record.data.byteLength} bytes`);
                try {
                  const decodedText = textDecoder.decode(record.data);
                  log(`• Text Decoded: "${decodedText}"`);
                } catch (e) {
                  log(`• Text Decoded: [Không thể giải mã UTF-8]`);
                }

                // Chuyển dữ liệu Byte thô sang dạng HEX
                const byteArray = new Uint8Array(record.data.buffer);
                const hexArray = Array.from(byteArray).map(b => b.toString(16).padStart(2, '0').toUpperCase());
                log(`• HEX Bytes: ${hexArray.join(' ')}`);
              }
            });
          }
          log(`==========================================`);

          // Tiến hành gọi API điểm danh mà KHÔNG XÓA khung log debug
          if (serialNumber) {
            await checkinStudent(serialNumber);
          }
        });

      } catch (error) {
        logDiv.textContent = `❌ Lỗi NFC: ${error.message || error}`;
      }
    });

    // Hàm gọi API điểm danh
    async function checkinStudent(uid) {
      log(`\n🚀 Đang gửi UID [${uid}] lên Server Backend...`);
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: uid })
        });

        const result = await response.json();

        if (result.success) {
          resultBox.className = 'result-box success';
          resTitle.textContent = '🎉 Điểm Danh Thành Công!';
          resName.textContent = result.data.fullName;
          resMssv.textContent = result.data.mssv;
          resTime.textContent = result.data.timestamp;
          resUid.textContent = result.data.uid;
          resultBox.style.display = 'block';

          log(`✅ Backend trả về: Nhận diện thành công [${result.data.fullName} - ${result.data.mssv}]`);
        } else {
          resultBox.className = 'result-box error';
          resTitle.textContent = '❌ Thẻ Chưa Đăng Ký';
          resName.textContent = 'Chưa có dữ liệu';
          resMssv.textContent = 'N/A';
          resTime.textContent = new Date().toLocaleTimeString('vi-VN');
          resUid.textContent = uid;
          resultBox.style.display = 'block';

          log(`⚠️ Backend trả về: ${result.message}`);
        }
      } catch (err) {
        log(`❌ Lỗi kết nối Backend: ${err.message}`);
      }
    }
  </script>
</body>
</html>
