<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Quét Thẻ NFC Sinh Viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active { background-color: #0056b3; }
    #log {
      margin-top: 20px;
      text-align: left;
      background: #eef2f7;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>NFC Student Card Reader</h2>
    <p>Chạm thẻ sinh viên vào mặt lưng điện thoại sau khi bật quét.</p>
    <button id="scanBtn">Bắt đầu quét NFC</button>
    <div id="log">Trạng thái: Sẵn sàng...</div>
  </div>

  <script>
    const scanBtn = document.getElementById('scanBtn');
    const logDiv = document.getElementById('log');

    function log(message) {
      logDiv.textContent += '\n' + message;
    }

    scanBtn.addEventListener('click', async () => {
      // 1. Kiểm tra thiết bị và trình duyệt có hỗ trợ Web NFC không
      if (!('NDEFReader' in window)) {
        logDiv.textContent = '❌ Trình duyệt hoặc thiết bị này không hỗ trợ Web NFC (Cần Chrome trên Android).';
        return;
      }

      try {
        logDiv.textContent = '⏳ Đang khởi tạo cảm biến NFC...';
        const ndef = new NDEFReader();
        
        // 2. Kích hoạt trình đọc NFC
        await ndef.scan();
        logDiv.textContent = '✅ Cảm biến đang bật! Vui lòng chạm thẻ sinh viên vào mặt lưng điện thoại...';

        // Xử lý khi xảy ra lỗi đọc
        ndef.addEventListener("readingerror", () => {
          log("⚠️ Không thể đọc dữ liệu thẻ. Hãy thử lại!");
        });

        // 3. Xử lý khi phát hiện thẻ và đọc thành công
        ndef.addEventListener("reading", ({ message, serialNumber }) => {
          log(`\n🎉 ĐÃ QUÉT THÀNH CÔNG!`);
          log(`----------------------------`);
          log(`Mã UID thẻ (Card Serial): ${serialNumber || 'Không thể lấy UID'}`);
          
          // Kiểm tra xem thẻ có lưu dữ liệu dạng NDEF hay không
          if (message.records.length > 0) {
            log(`Dữ liệu NDEF ghi trong thẻ:`);
            const textDecoder = new TextDecoder();
            for (const record of message.records) {
              log(`- Type: ${record.recordType}`);
              log(`- Data: ${textDecoder.decode(record.data)}`);
            }
          } else {
            log(`(Thẻ trắng hoặc không dùng chuẩn định dạng NDEF - sử dụng UID để điểm danh)`);
          }
        });

      } catch (error) {
        log(`❌ Lỗi: ${error.message || error}`);
      }
    });
  </script>
</body>
</html>
